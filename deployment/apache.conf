<VirtualHost *:80>
    ServerName ais.yourdomain.com
    
    # Necessary Apache modules to enable before using this configuration:
    # sudo a2enmod proxy proxy_http proxy_wstunnel rewrite

    # Proxy WebSocket Traffic (if your AIS app map uses WebSockets for live data)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:your_port/$1" [P,L]

    # Proxy standard HTTP Traffic to FastAPI
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:your_port/
    ProxyPassReverse / http://127.0.0.1:your_port/

    ErrorLog ${APACHE_LOG_DIR}/ais-app-error.log
    CustomLog ${APACHE_LOG_DIR}/ais-app-access.log combined
</VirtualHost>
