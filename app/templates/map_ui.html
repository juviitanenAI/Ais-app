<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>AIS Ship Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Real-time AIS ship tracking on nautical charts"/>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/map_ui.css"/>
</head>
<body>

  <div id="loading-overlay">
    <div class="loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Connecting to AIS feed…</div>
    </div>
  </div>

  <div id="app" class="sidebar-visible">
    <div id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-title">
          <span class="icon">⚓</span> AIS Tracker
          <span class="version">Version <span class="app-version">0.2</span></span>
        </div>
        <div class="search-box">
          <input type="text" id="search" placeholder="Search vessel name or MMSI…" autocomplete="off"/>
        </div>
        <div class="filter-box">
          <select id="type-filter">
            <option value="">All Vessel Types</option>
          </select>
        </div>
      </div>

      <div class="stats-bar">
        <div class="stat left-stat">
          <div class="stat-dot"></div>
          <span id="vessel-count">0</span> vessels
        </div>
        <div class="mobile-branding">
          ⚓&nbsp;&nbsp; AIS Tracker&nbsp;&nbsp;v<span class="app-version">0.2</span>
        </div>
        <div class="stat right-stat">
          <span id="ws-status">Connecting…</span>
          <button id="mobile-list-close" class="mobile-list-close" title="Close List">✕</button>
        </div>
      </div>

      <div class="vessel-list" id="vessel-list"></div>

      <div class="detail-panel" id="detail-panel">
        <div class="detail-header">
          <span class="detail-name" id="detail-name">—</span>
          <button class="detail-close" id="detail-close">✕</button>
        </div>
        <div class="detail-grid" id="detail-grid"></div>
        <div class="history-controls">
          <button class="history-btn" data-minutes="60">1h</button>
          <button class="history-btn active" data-minutes="180">3h</button>
          <button class="history-btn" data-minutes="720">12h</button>
          <button class="history-btn" data-minutes="1440">24h</button>
        </div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <button id="sidebar-toggle" title="Toggle sidebar">☰</button>

  <div class="map-legend" id="map-legend">
    <div class="legend-title">Vessel Types</div>
    <div id="map-legend-items">
      <!-- Populated dynamically by ui.js -->
      <div class="legend-row"><div class="legend-dot" style="background:var(--ship-other)"></div> Loading types...</div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script type="module" src="/static/js/main.js"></script>

</body>
</html>
